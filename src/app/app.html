              [class.category-selected]="selectedCategory() === ''"

              All fish

            @for (category of categories(); track category.id) {
              <button
                type="button"
                class="category-chip"
                [class.category-selected]="selectedCategory() === category.name"
                (click)="chooseCategory(category.name)"
              >
                {{ category.name }}
              </button>
            }
          </div>
        </div>

            class="primary-button"
            (click)="loadProducts()"

            class="text-link"

                [attr.aria-label]="'View details for ' + product.name"
              >
                <div class="product-image">
                  <img
                    [src]="product.imageUrl || fallbackImage"
                    [alt]="product.name"
                    loading="lazy"
                    (error)="onImageError($event)"
                  >

                  <span class="image-category">
                    {{ product.category }}
                  </span>
                </div>
              </button>

              <div class="product-content">
                <div class="product-meta">
                  <span class="species-label">
                    {{ product.category }}
                  </span>

                  <span
                    class="stock-label"
                    [class.out-of-stock]="!product.inStock"
                  >
                    <span class="stock-dot"></span>
                    {{ product.inStock ? 'In stock' : 'Out of stock' }}
                  </span>
                </div>

                <h3>{{ product.name }}</h3>

                <p class="product-description">
                  {{ product.description }}
                </p>

                <div class="product-card-bottom">
                  <div class="price-block">
                    <small>Price</small>
                    <strong>
                      {{ product.price | currency:'INR':'symbol':'1.0-2' }}
                    </strong>
                  </div>

                  <button
                    type="button"
                    class="details-button"
                    (click)="openProductDetails(product)"
                  >
                    View details <span aria-hidden="true">↗</span>
                  </button>
                </div>
              </div>
            </article>
          }
        </div>

        @if (totalPages() > 1) {
          <div class="pagination">
            <button
              type="button"
              class="pagination-button"
              (click)="previousPage()"
              [disabled]="page() === 0"
            >
              ← Previous
            </button>

            <span>
              Page {{ page() + 1 }} of {{ totalPages() }}
            </span>

            <button
              type="button"
              class="pagination-button"
              (click)="nextPage()"
              [disabled]="page() + 1 >= totalPages()"
            >
              Next →
            </button>
          </div>
        }
      }
